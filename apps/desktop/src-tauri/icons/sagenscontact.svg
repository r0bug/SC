<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22D3EE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Contact card background -->
  <rect x="96" y="120" width="320" height="280" rx="20" ry="20" fill="white" opacity="0.95"/>

  <!-- Profile circle -->
  <circle cx="192" cy="200" r="48" fill="url(#accent)"/>

  <!-- Person silhouette in circle -->
  <circle cx="192" cy="185" r="18" fill="white"/>
  <ellipse cx="192" cy="225" rx="28" ry="20" fill="white"/>

  <!-- Contact lines -->
  <rect x="268" y="168" width="120" height="16" rx="8" fill="#4F46E5" opacity="0.8"/>
  <rect x="268" y="196" width="90" height="12" rx="6" fill="#9CA3AF"/>
  <rect x="268" y="220" width="100" height="12" rx="6" fill="#9CA3AF"/>

  <!-- Divider line -->
  <rect x="120" y="268" width="272" height="2" fill="#E5E7EB"/>

  <!-- Phone icon row -->
  <circle cx="148" cy="310" r="16" fill="#22D3EE" opacity="0.2"/>
  <path d="M142 304 L148 310 L154 304 L151 307 C151 313 145 313 145 307 Z" fill="#0891B2" transform="rotate(135 148 310)"/>
  <rect x="176" y="304" width="180" height="12" rx="6" fill="#6B7280"/>

  <!-- Email icon row -->
  <circle cx="148" cy="350" r="16" fill="#22D3EE" opacity="0.2"/>
  <rect x="138" y="344" width="20" height="12" rx="2" fill="#0891B2"/>
  <path d="M138 344 L148 352 L158 344" stroke="#0891B2" stroke-width="2" fill="none"/>
  <rect x="176" y="344" width="160" height="12" rx="6" fill="#6B7280"/>

  <!-- Stylized "S" badge -->
  <circle cx="380" cy="120" r="40" fill="url(#accent)"/>
  <text x="380" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="48" fill="white">S</text>
</svg>
