<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; }
        button { padding: 1rem 2rem; font-size: 1.2rem; cursor: pointer; margin: 0.5rem; }
        pre { background: #f5f5f5; padding: 1rem; border: 1px solid #ddd; white-space: pre-wrap; }
        .error { background: #fee; border-color: #f00; color: #900; }
        .success { background: #efe; border-color: #0f0; color: #090; }
    </style>
</head>
<body>
    <h1>API Connection Test</h1>

    <div>
        <button onclick="testDirect()">Test Direct (port 3002)</button>
        <button onclick="testProxy()">Test Proxy (port 3001)</button>
        <button onclick="testLogin()">Test Login Flow</button>
    </div>

    <div id="output"></div>

    <script>
        const output = document.getElementById('output');

        function log(msg, isError = false) {
            const div = document.createElement('pre');
            div.textContent = msg;
            div.className = isError ? 'error' : 'success';
            output.appendChild(div);
        }

        async function testDirect() {
            output.innerHTML = '<h2>Testing Direct Connection (localhost:3002)</h2>';

            try {
                const response = await fetch('http://localhost:3002/api/health');
                log('✓ Direct connection works! Status: ' + response.status);
                const text = await response.text();
                log('Response: ' + text);
            } catch (e) {
                log('✗ Direct connection failed: ' + e.message, true);
            }
        }

        async function testProxy() {
            output.innerHTML = '<h2>Testing Proxy Connection (localhost:3001/api)</h2>';

            try {
                const response = await fetch('/api/health');
                log('✓ Proxy works! Status: ' + response.status);
                const text = await response.text();
                log('Response: ' + text);
            } catch (e) {
                log('✗ Proxy failed: ' + e.message, true);
            }
        }

        async function testLogin() {
            output.innerHTML = '<h2>Testing Login Flow</h2>';

            try {
                // Step 1: Signup
                log('Step 1: Creating account...');
                const signupResponse = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'password123',
                        name: 'Test User'
                    })
                });

                if (!signupResponse.ok) {
                    const errorText = await signupResponse.text();
                    log('Signup status: ' + signupResponse.status + ' - ' + errorText, true);
                } else {
                    const signupData = await signupResponse.json();
                    log('✓ Signup successful! Token received: ' + signupData.token.substring(0, 20) + '...');
                }

                // Step 2: Login
                log('\nStep 2: Logging in...');
                const loginResponse = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'test@example.com',
                        password: 'password123'
                    })
                });

                if (!loginResponse.ok) {
                    const errorText = await loginResponse.text();
                    log('Login status: ' + loginResponse.status + ' - ' + errorText, true);
                } else {
                    const loginData = await loginResponse.json();
                    log('✓ Login successful!');
                    log('User: ' + JSON.stringify(loginData.user, null, 2));
                    log('Token: ' + loginData.token.substring(0, 50) + '...');
                }

            } catch (e) {
                log('✗ Test failed: ' + e.message, true);
                log('Stack: ' + e.stack, true);
            }
        }
    </script>
</body>
</html>
