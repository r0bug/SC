[package]
name = "secure_vault"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = { version = "0.10", features = ["std", "aes"], default-features = false }
base64 = "0.21"
clap = { version = "4.4", features = ["derive"], optional = true }
once_cell = "1.18"
pbkdf2 = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
cli = ["clap"]

[[bin]]
name = "vault_tool"
path = "src/bin/vault_tool.rs"
required-features = ["cli"]
